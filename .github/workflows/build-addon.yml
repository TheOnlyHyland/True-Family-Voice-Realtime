name: Build and Publish Home Assistant Addon

on:
  push:
    branches:
      - main
      - master
    paths:
      - "openai_realtime_voice_agent/**"
      - ".github/scripts/release_integrity.py"
      - ".github/workflows/build-addon.yml"
  pull_request:
    branches:
      - main
      - master
    paths:
      - "openai_realtime_voice_agent/**"
      - ".github/scripts/release_integrity.py"
      - ".github/workflows/build-addon.yml"
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish immutable version and source tags before the GitHub release"
        required: true
        default: false
        type: boolean
      release_tag:
        description: "Required when publish=true, for example v0.22.9"
        required: false
        type: string
      source_commit:
        description: "Exact 40-character candidate commit to publish"
        required: false
        type: string
      pilot_firmware_source_only:
        description: "Historical pilot switch; rejected when publishing 0.22.9"
        required: true
        default: false
        type: boolean

concurrency:
  group: addon-${{ (github.event_name == 'release' && github.event.release.tag_name) || (github.event_name == 'workflow_dispatch' && inputs.publish && inputs.release_tag) || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: theonlyhyland/true-family-voice-realtime/openai-realtime-voice-agent
  ADDON_VERSION: 0.22.9
  FIRMWARE_RELEASE_BINDING: finalized
  FIRMWARE_RELEASE_VERSION: 0.20.2
  FIRMWARE_RELEASE_SOURCE_COMMIT: f1ec219732e1015c63314b8ae7f395e4b10209eb
  FIRMWARE_RELEASE_REPOSITORY: TheOnlyHyland/True-Family-Voice-Firmware
  FIRMWARE_RELEASE_MANIFEST_SHA256: 71793abf3f1a77c32e82a4ecca8c5549cf24ae7b4346599580cc919059ac4b21
  FIRMWARE_RELEASE_FACTORY_SHA256: d64b1619257801cc5887a96e8a6f51e39719609a822d5f31506ec5780b9db9ab
  FIRMWARE_RELEASE_OTA_SHA256: 5e33514f1d036eb263989c8e64930c0dfdb76c2fc5e9c7062a8eaa9d10940b48
  FIRMWARE_RELEASE_ELF_SHA256: 97ba5a12444e4ec7e7c9348f9729d025f2d698dca039f1276cecfaa493c0d1e2
  FIRMWARE_RELEASE_SHA256SUMS_SHA256: 7b518719f1e8a30190240bd027b975deb7bad6f6d92b9fdd422ef87318a55bc8
  RELEASE_EVIDENCE_ARTIFACT: true-family-voice-backend-0.22.9-release-evidence-${{ github.sha }}
  RELEASE_EVIDENCE_FILE: true-family-voice-backend-0.22.9-release-evidence.json
  POETRY_LOCK_SHA256: 13193c62fc95a0c05c7b6e89efe7db060b4f00438db46c83dc43a23eb1d9af15
  TITANET_MODEL_SHA256: d51abcf31717ef28162f26acb9d44dd4127c3d44c9b8624f699f3425daca8e77
  TITANET_MODEL_URL: https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-recongition-models/nemo_en_titanet_large.onnx
  DEBIAN_SNAPSHOT: 20260801T000000Z
  POETRY_VERSION: 2.0.1
  POETRY_CORE_VERSION: 2.0.1
  AARCH64_BASE_IMAGE: ghcr.io/home-assistant/aarch64-base-debian@sha256:4ecdb87bbf2e24c220140aedefdc521f7e3c499bc116c886f432261dc247d2f8
  AMD64_BASE_IMAGE: ghcr.io/home-assistant/amd64-base-debian@sha256:84023298f975360b4350fe76118a1a5b117ff8f7ca5249d6398381659051aba3

jobs:
  test:
    name: Backend protocol and unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Require finalized exact firmware release binding
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        shell: bash
        run: |
          set -euo pipefail
          test "$FIRMWARE_RELEASE_BINDING" = "finalized"
          test "$FIRMWARE_RELEASE_VERSION" = "0.20.2"
          test "$FIRMWARE_RELEASE_REPOSITORY" = \
            "TheOnlyHyland/True-Family-Voice-Firmware"
          test "$FIRMWARE_RELEASE_SOURCE_COMMIT" = \
            "f1ec219732e1015c63314b8ae7f395e4b10209eb"
          test "$FIRMWARE_RELEASE_MANIFEST_SHA256" = \
            "71793abf3f1a77c32e82a4ecca8c5549cf24ae7b4346599580cc919059ac4b21"
          test "$FIRMWARE_RELEASE_FACTORY_SHA256" = \
            "d64b1619257801cc5887a96e8a6f51e39719609a822d5f31506ec5780b9db9ab"
          test "$FIRMWARE_RELEASE_OTA_SHA256" = \
            "5e33514f1d036eb263989c8e64930c0dfdb76c2fc5e9c7062a8eaa9d10940b48"
          test "$FIRMWARE_RELEASE_ELF_SHA256" = \
            "97ba5a12444e4ec7e7c9348f9729d025f2d698dca039f1276cecfaa493c0d1e2"
          test "$FIRMWARE_RELEASE_SHA256SUMS_SHA256" = \
            "7b518719f1e8a30190240bd027b975deb7bad6f6d92b9fdd422ef87318a55bc8"
          [[ "$FIRMWARE_RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$FIRMWARE_RELEASE_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          for DIGEST in \
            "$FIRMWARE_RELEASE_MANIFEST_SHA256" \
            "$FIRMWARE_RELEASE_FACTORY_SHA256" \
            "$FIRMWARE_RELEASE_OTA_SHA256" \
            "$FIRMWARE_RELEASE_ELF_SHA256" \
            "$FIRMWARE_RELEASE_SHA256SUMS_SHA256"; do
            [[ "$DIGEST" =~ ^[0-9a-f]{64}$ ]]
          done

      - name: Checkout exact release firmware source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ${{ env.FIRMWARE_RELEASE_REPOSITORY }}
          ref: ${{ env.FIRMWARE_RELEASE_SOURCE_COMMIT }}
          path: firmware-candidate
          persist-credentials: false

      - name: Verify exact release firmware source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C firmware-candidate rev-parse HEAD)" = \
            "$FIRMWARE_RELEASE_SOURCE_COMMIT"
          test "$(tr -d '\r\n' < firmware-candidate/VERSION)" = \
            "$FIRMWARE_RELEASE_VERSION"

      - name: Download and verify immutable release firmware package
        if: ${{ github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        shell: bash
        run: |
          set -euo pipefail
          PACKAGE_ROOT="$RUNNER_TEMP/true-family-voice-firmware-release"
          RELEASE_URL="https://github.com/$FIRMWARE_RELEASE_REPOSITORY/releases/download/$FIRMWARE_RELEASE_VERSION"
          mkdir -p "$PACKAGE_ROOT"
          for FILE in \
            manifest.json \
            true-family-voice-esp32s3.factory.bin \
            true-family-voice-esp32s3.ota.bin \
            true-family-voice-esp32s3.elf \
            SHA256SUMS; do
            curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
              --output "$PACKAGE_ROOT/$FILE" "$RELEASE_URL/$FILE"
          done
          test "$(sha256sum "$PACKAGE_ROOT/manifest.json")" = \
            "$FIRMWARE_RELEASE_MANIFEST_SHA256  $PACKAGE_ROOT/manifest.json"
          test "$(sha256sum "$PACKAGE_ROOT/true-family-voice-esp32s3.factory.bin")" = \
            "$FIRMWARE_RELEASE_FACTORY_SHA256  $PACKAGE_ROOT/true-family-voice-esp32s3.factory.bin"
          test "$(sha256sum "$PACKAGE_ROOT/true-family-voice-esp32s3.ota.bin")" = \
            "$FIRMWARE_RELEASE_OTA_SHA256  $PACKAGE_ROOT/true-family-voice-esp32s3.ota.bin"
          test "$(sha256sum "$PACKAGE_ROOT/true-family-voice-esp32s3.elf")" = \
            "$FIRMWARE_RELEASE_ELF_SHA256  $PACKAGE_ROOT/true-family-voice-esp32s3.elf"
          test "$(sha256sum "$PACKAGE_ROOT/SHA256SUMS")" = \
            "$FIRMWARE_RELEASE_SHA256SUMS_SHA256  $PACKAGE_ROOT/SHA256SUMS"
          (cd "$PACKAGE_ROOT" && sha256sum --check SHA256SUMS)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install pinned Poetry toolchain
        run: |
          python -m pip install \
            "poetry==$POETRY_VERSION" \
            "poetry-core==$POETRY_CORE_VERSION"

      - name: Install locked production dependencies
        working-directory: openai_realtime_voice_agent
        run: |
          VENV="$RUNNER_TEMP/true-family-voice-production"
          test "$(sha256sum poetry.lock)" = "$POETRY_LOCK_SHA256  poetry.lock"
          poetry check --lock
          python -m venv "$VENV"
          VIRTUAL_ENV="$VENV" PATH="$VENV/bin:$PATH" poetry sync --only main --no-root --no-interaction --no-ansi
          "$VENV/bin/python" -c 'from importlib.metadata import version; assert version("pipecat-ai") == "0.0.97"; assert version("numpy") == "2.2.6"; assert version("loguru") == "0.7.3"'
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Run backend tests against exact firmware source and release evidence
        working-directory: openai_realtime_voice_agent
        env:
          TRUE_FAMILY_VOICE_FIRMWARE_ROOT: ${{ github.workspace }}/firmware-candidate
          TRUE_FAMILY_VOICE_FIRMWARE_ARTIFACT_ROOT: ${{ runner.temp }}/true-family-voice-firmware-release
          TRUE_FAMILY_VOICE_REQUIRE_FIRMWARE_VALIDATION: ${{ (github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish)) && '1' || '0' }}
        run: python -m unittest discover -s tests -v

      - name: Compile backend sources
        working-directory: openai_realtime_voice_agent
        run: python -m compileall -q app tests

      - name: Validate shell entry points
        working-directory: openai_realtime_voice_agent
        run: |
          bash -n root/run.sh tests/production_rootfs_smoke.sh
          shellcheck --shell=bash root/run.sh tests/production_rootfs_smoke.sh

  build-smoke:
    name: Build and smoke ${{ matrix.arch }} image
    if: github.event_name != 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            docker_arch: arm64
            base_image: ghcr.io/home-assistant/aarch64-base-debian@sha256:4ecdb87bbf2e24c220140aedefdc521f7e3c499bc116c886f432261dc247d2f8
          - arch: amd64
            platform: linux/amd64
            docker_arch: amd64
            base_image: ghcr.io/home-assistant/amd64-base-debian@sha256:84023298f975360b4350fe76118a1a5b117ff8f7ca5249d6398381659051aba3

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify source and requested version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          PUBLISH: ${{ inputs.publish }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PILOT_FIRMWARE_SOURCE_ONLY: ${{ inputs.pilot_firmware_source_only }}
        run: |
          VERSION=$(python -c 'import pathlib, re; text = pathlib.Path("openai_realtime_voice_agent/config.yaml").read_text(); print(re.search(r"^version: \"([^\"]+)\"$", text, re.MULTILINE).group(1))')
          test "$VERSION" = "$ADDON_VERSION"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$PUBLISH" == "true" ]]; then
            test "$FIRMWARE_RELEASE_BINDING" = "finalized"
            test "$PILOT_FIRMWARE_SOURCE_ONLY" != "true"
            [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
            test "$GITHUB_SHA" = "$SOURCE_COMMIT"
            test "$RELEASE_TAG" = "v$VERSION"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Build exact production image once
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25
        with:
          context: ./openai_realtime_voice_agent
          file: ./openai_realtime_voice_agent/Dockerfile
          platforms: ${{ matrix.platform }}
          load: true
          push: false
          tags: true-family-voice-realtime:${{ matrix.arch }}-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_FROM=${{ matrix.base_image }}
            BUILD_VERSION=${{ env.ADDON_VERSION }}
            BUILD_REVISION=${{ github.sha }}
            DEBIAN_SNAPSHOT=${{ env.DEBIAN_SNAPSHOT }}
            POETRY_VERSION=${{ env.POETRY_VERSION }}
            POETRY_CORE_VERSION=${{ env.POETRY_CORE_VERSION }}
            POETRY_LOCK_SHA256=${{ env.POETRY_LOCK_SHA256 }}
            TITANET_MODEL_URL=${{ env.TITANET_MODEL_URL }}
            TITANET_MODEL_SHA256=${{ env.TITANET_MODEL_SHA256 }}

      - name: Smoke the content-addressed image
        env:
          EXPECTED_IMAGE_ID: ${{ steps.build.outputs.imageid }}
          IMAGE_REF: true-family-voice-realtime:${{ matrix.arch }}-${{ github.sha }}
          EXPECTED_ARCH: ${{ matrix.docker_arch }}
        run: |
          set -euo pipefail
          IMAGE_ID=$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')
          test "$IMAGE_ID" = "$EXPECTED_IMAGE_ID"
          test "$(docker image inspect "$IMAGE_ID" --format '{{.Architecture}}')" = "$EXPECTED_ARCH"
          test "$(docker image inspect "$IMAGE_ID" --format '{{json .Config.Cmd}}')" = '["/run.sh"]'
          test "$(docker image inspect "$IMAGE_ID" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}')" = "$ADDON_VERSION"
          test "$(docker image inspect "$IMAGE_ID" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          test "$(docker image inspect "$IMAGE_ID" --format '{{ index .Config.Labels "io.true-family.voice.debian-snapshot" }}')" = "$DEBIAN_SNAPSHOT"
          test "$(docker image inspect "$IMAGE_ID" --format '{{ index .Config.Labels "io.true-family.voice.poetry-version" }}')" = "$POETRY_VERSION"
          test "$(docker image inspect "$IMAGE_ID" --format '{{ index .Config.Labels "io.true-family.voice.poetry-core-version" }}')" = "$POETRY_CORE_VERSION"
          test "$(docker image inspect "$IMAGE_ID" --format '{{ index .Config.Labels "io.true-family.voice.poetry-lock-sha256" }}')" = "$POETRY_LOCK_SHA256"
          test "$(docker image inspect "$IMAGE_ID" --format '{{ index .Config.Labels "io.true-family.voice.titanet-source" }}')" = "$TITANET_MODEL_URL"
          test "$(docker image inspect "$IMAGE_ID" --format '{{ index .Config.Labels "io.true-family.voice.titanet-sha256" }}')" = "$TITANET_MODEL_SHA256"
          test "$(docker run --rm --entrypoint sha256sum "$IMAGE_ID" /usr/share/true-family-voice/poetry.lock)" = "$POETRY_LOCK_SHA256  /usr/share/true-family-voice/poetry.lock"
          test "$(docker run --rm --entrypoint sha256sum "$IMAGE_ID" /opt/voiceprint/embedder.onnx)" = "$TITANET_MODEL_SHA256  /opt/voiceprint/embedder.onnx"
          docker run --rm --entrypoint /bin/bash "$IMAGE_ID" -c 'test "$PYTHONSAFEPATH" = "1"; test ! -e /app; python3 -P -c '\''import importlib.util; spec = importlib.util.find_spec("app.main"); assert spec is not None and "/site-packages/app/main.py" in spec.origin'\'''
          docker run --rm --entrypoint python3 "$IMAGE_ID" -P -c 'from importlib.metadata import version; assert version("pipecat-ai") == "0.0.97"; assert version("numpy") == "2.2.6"; assert version("loguru") == "0.7.3"'
          docker run --rm -e TRUE_FAMILY_VOICE_STARTUP_SMOKE=1 "$IMAGE_ID"

      - name: Seal the exact smoked image artifact
        env:
          EXPECTED_IMAGE_ID: ${{ steps.build.outputs.imageid }}
          IMAGE_REF: true-family-voice-realtime:${{ matrix.arch }}-${{ github.sha }}
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/true-family-voice-image-${{ matrix.arch }}"
          ARCHIVE="$ARTIFACT_ROOT/image-${{ matrix.arch }}.tar"
          METADATA="$ARTIFACT_ROOT/image-${{ matrix.arch }}.json"
          mkdir -p "$ARTIFACT_ROOT"
          test "$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')" = "$EXPECTED_IMAGE_ID"
          docker image save --output "$ARCHIVE" "$IMAGE_REF"
          ARCHIVE_SHA256=$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)
          jq -n \
            --arg arch "${{ matrix.arch }}" \
            --arg docker_arch "${{ matrix.docker_arch }}" \
            --arg image_ref "$IMAGE_REF" \
            --arg image_id "$EXPECTED_IMAGE_ID" \
            --arg archive_sha256 "$ARCHIVE_SHA256" \
            --arg source_sha "$GITHUB_SHA" \
            --arg version "$ADDON_VERSION" \
            '{arch: $arch, docker_arch: $docker_arch, image_ref: $image_ref, image_id: $image_id, archive_sha256: $archive_sha256, source_sha: $source_sha, version: $version}' \
            > "$METADATA"

      - name: Upload exact smoked image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: true-family-voice-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/true-family-voice-image-${{ matrix.arch }}/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish exact smoked architecture images
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs:
      - test
      - build-smoke
    runs-on: ubuntu-latest
    environment: backend-production
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Validate protected publication request
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PILOT_FIRMWARE_SOURCE_ONLY: ${{ inputs.pilot_firmware_source_only }}
        run: |
          test "$FIRMWARE_RELEASE_BINDING" = "finalized"
          test "$PILOT_FIRMWARE_SOURCE_ONLY" != "true"
          [[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$SOURCE_COMMIT"
          test "$RELEASE_TAG" = "v$ADDON_VERSION"

      - name: Download exact smoked image artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: true-family-voice-image-*
          path: ${{ runner.temp }}/built-images
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load and verify exact smoked images
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/built-images"
          for ARCH in aarch64 amd64; do
            ARCHIVE="$ARTIFACT_ROOT/image-$ARCH.tar"
            METADATA="$ARTIFACT_ROOT/image-$ARCH.json"
            test -s "$ARCHIVE"
            test -s "$METADATA"
            test "$(jq -er '.arch' "$METADATA")" = "$ARCH"
            test "$(jq -er '.source_sha' "$METADATA")" = "$GITHUB_SHA"
            test "$(jq -er '.version' "$METADATA")" = "$ADDON_VERSION"
            test "$(sha256sum "$ARCHIVE" | cut -d ' ' -f 1)" = \
              "$(jq -er '.archive_sha256' "$METADATA")"
            docker image load --input "$ARCHIVE"
            IMAGE_REF=$(jq -er '.image_ref' "$METADATA")
            IMAGE_ID=$(jq -er '.image_id' "$METADATA")
            test "$(docker image inspect "$IMAGE_REF" --format '{{.Id}}')" = "$IMAGE_ID"
            test "$(docker image inspect "$IMAGE_ID" --format '{{.Architecture}}')" = \
              "$(jq -er '.docker_arch' "$METADATA")"
            test "$(docker image inspect "$IMAGE_ID" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')" = "$GITHUB_SHA"
          done

      - name: Refuse immutable version or source-tag overwrite
        run: |
          set -euo pipefail
          for ARCH in aarch64 amd64; do
            IMAGE="$REGISTRY/$IMAGE_NAME-$ARCH"
            for TAG in "$ADDON_VERSION" "sha-$GITHUB_SHA"; do
              python3 .github/scripts/release_integrity.py \
                require-manifest-absent "$IMAGE:$TAG"
            done
          done

      - name: Publish the unchanged gated images
        id: publish-images
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="$RUNNER_TEMP/built-images"
          for ARCH in aarch64 amd64; do
            METADATA="$ARTIFACT_ROOT/image-$ARCH.json"
            IMAGE_ID=$(jq -er '.image_id' "$METADATA")
            IMAGE="$REGISTRY/$IMAGE_NAME-$ARCH"
            VERSION_REF="$IMAGE:$ADDON_VERSION"
            SOURCE_REF="$IMAGE:sha-$GITHUB_SHA"
            docker tag "$IMAGE_ID" "$VERSION_REF"
            docker tag "$IMAGE_ID" "$SOURCE_REF"
            docker push "$VERSION_REF"
            docker push "$SOURCE_REF"
            VERSION_MANIFEST=$(docker manifest inspect "$VERSION_REF")
            SOURCE_MANIFEST=$(docker manifest inspect "$SOURCE_REF")
            test "$VERSION_MANIFEST" = "$SOURCE_MANIFEST"
            VERSION_DIGEST=$(docker manifest inspect --verbose "$VERSION_REF" | jq -er '.Descriptor.digest')
            SOURCE_DIGEST=$(docker manifest inspect --verbose "$SOURCE_REF" | jq -er '.Descriptor.digest')
            test "$VERSION_DIGEST" = "$SOURCE_DIGEST"
            [[ "$VERSION_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
            if [[ "$ARCH" == "aarch64" ]]; then
              AARCH64_DIGEST="$VERSION_DIGEST"
            else
              AMD64_DIGEST="$VERSION_DIGEST"
            fi
            echo "Published unchanged gated image: $VERSION_REF"
            echo "Published source identity: $SOURCE_REF"
            echo "Published digest: $VERSION_DIGEST"
          done
          test -n "${AARCH64_DIGEST:-}"
          test -n "${AMD64_DIGEST:-}"
          echo "aarch64_digest=$AARCH64_DIGEST" >> "$GITHUB_OUTPUT"
          echo "amd64_digest=$AMD64_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Build machine-readable backend release evidence
        env:
          AARCH64_DIGEST: ${{ steps.publish-images.outputs.aarch64_digest }}
          AMD64_DIGEST: ${{ steps.publish-images.outputs.amd64_digest }}
        run: |
          set -euo pipefail
          EVIDENCE_ROOT="$RUNNER_TEMP/backend-release-evidence"
          mkdir -p "$EVIDENCE_ROOT"
          python3 .github/scripts/release_integrity.py write-evidence \
            --output "$EVIDENCE_ROOT/$RELEASE_EVIDENCE_FILE" \
            --version "$ADDON_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --registry "$REGISTRY" \
            --image-name "$IMAGE_NAME" \
            --aarch64-digest "$AARCH64_DIGEST" \
            --amd64-digest "$AMD64_DIGEST"

      - name: Validate backend release evidence before upload
        run: |
          set -euo pipefail
          python3 .github/scripts/release_integrity.py validate-evidence \
            --file "$RUNNER_TEMP/backend-release-evidence/$RELEASE_EVIDENCE_FILE" \
            --version "$ADDON_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --registry "$REGISTRY" \
            --image-name "$IMAGE_NAME"

      - name: Upload immutable backend release evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.RELEASE_EVIDENCE_ARTIFACT }}
          path: ${{ runner.temp }}/backend-release-evidence/${{ env.RELEASE_EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 90

  release-verify:
    name: Verify release uses pre-published immutable images
    if: github.event_name == 'release'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      packages: read

    steps:
      - name: Checkout exact release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Locate exact successful publication evidence
        id: locate-evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ARTIFACT_PAGES="$RUNNER_TEMP/backend-release-artifacts.json"
          RUN_RECORD="$RUNNER_TEMP/backend-publication-run.json"
          gh api --paginate \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/artifacts?name=$RELEASE_EVIDENCE_ARTIFACT&per_page=100" \
            | jq -s '.' > "$ARTIFACT_PAGES"
          SELECTION=$(python3 .github/scripts/release_integrity.py \
            select-artifact \
            --pages "$ARTIFACT_PAGES" \
            --name "$RELEASE_EVIDENCE_ARTIFACT" \
            --source-commit "$GITHUB_SHA")
          ARTIFACT_ID=$(jq -er '.artifact_id' <<< "$SELECTION")
          RUN_ID=$(jq -er '.run_id' <<< "$SELECTION")
          [[ "$ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          gh api \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" \
            > "$RUN_RECORD"
          python3 .github/scripts/release_integrity.py \
            validate-publication-run \
            --file "$RUN_RECORD" \
            --run-id "$RUN_ID" \
            --repository "$GITHUB_REPOSITORY" \
            --source-commit "$GITHUB_SHA" \
            --workflow-path ".github/workflows/build-addon.yml"
          echo "artifact_id=$ARTIFACT_ID" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download exact publication evidence by artifact and run ID
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.locate-evidence.outputs.artifact_id }}
          run-id: ${{ steps.locate-evidence.outputs.run_id }}
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          path: ${{ runner.temp }}/backend-release-evidence
          merge-multiple: true

      - name: Validate exact publication evidence
        run: |
          set -euo pipefail
          python3 .github/scripts/release_integrity.py validate-evidence \
            --file "$RUNNER_TEMP/backend-release-evidence/$RELEASE_EVIDENCE_FILE" \
            --version "$ADDON_VERSION" \
            --source-commit "$GITHUB_SHA" \
            --registry "$REGISTRY" \
            --image-name "$IMAGE_NAME"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release artifact was published first
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          test "$FIRMWARE_RELEASE_BINDING" = "finalized"
          test "$RELEASE_TAG" = "v$ADDON_VERSION"
          EVIDENCE_FILE="$RUNNER_TEMP/backend-release-evidence/$RELEASE_EVIDENCE_FILE"
          for ARCH in aarch64 amd64; do
            VERSION_REF=$(jq -er --arg arch "$ARCH" '.images[$arch].version_ref' "$EVIDENCE_FILE")
            SOURCE_REF=$(jq -er --arg arch "$ARCH" '.images[$arch].source_ref' "$EVIDENCE_FILE")
            RECORDED_DIGEST=$(jq -er --arg arch "$ARCH" '.images[$arch].manifest_digest' "$EVIDENCE_FILE")
            VERSION_DIGEST=$(docker manifest inspect --verbose "$VERSION_REF" | jq -er '.Descriptor.digest')
            SOURCE_DIGEST=$(docker manifest inspect --verbose "$SOURCE_REF" | jq -er '.Descriptor.digest')
            test "$VERSION_DIGEST" = "$RECORDED_DIGEST"
            test "$SOURCE_DIGEST" = "$RECORDED_DIGEST"
          done
