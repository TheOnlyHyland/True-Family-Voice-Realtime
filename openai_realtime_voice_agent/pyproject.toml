[tool.poetry]
name = "openai-realtime-voice-agent"
version = "0.22.8"
description = "Home Assistant addon for OpenAI Realtime API voice control with WebSocket support using Pipecat"
authors = ["Your Name <your.email@example.com>"]
packages = [{include = "app", from = "."}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
# Pinned to the 0.0.x line: this codebase targets the Pipecat 0.0.x API
# (FrameSerializerType, OpenAIRealtimeLLMService, SessionProperties events,
# WebsocketServerParams). The lock, Docker build, and CI all assert 0.0.97;
# Pipecat 1.x has incompatible imports and transport behavior.
pipecat-ai = {extras = ["mcp", "openai", "websocket"], version = "0.0.97"}
python-dotenv = ">=1.0.0"
# NumPy 1.26 has no Python 3.13 wheel; 2.2.6 also satisfies Numba's <2.3 bound.
numpy = "2.2.6"
loguru = "0.7.3"
# Voice-print speaker ID (fork): ONNX speaker-embedding runtime. Ships
# manylinux aarch64/amd64 wheels; the model file itself is fetched in the
# Dockerfile (small, pinned).
sherpa-onnx = ">=1.10.0"
fastapi = ">=0.100.0"
uvicorn = {extras = ["standard"], version = ">=0.23.0"}
websockets = ">=13.0"

[tool.poetry.scripts]
start = "app.main:main"

[build-system]
requires = ["poetry-core==2.0.1"]
build-backend = "poetry.core.masonry.api"
